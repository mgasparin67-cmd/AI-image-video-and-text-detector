<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image scores</title>
  <style>body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; } pre { background: #f4f4f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; }</style>
</head>
<body>
  <h1>Image scores</h1>
  <p>Scores every image in <code>?data=FILE.json</code> ({ rows: [{ url, ... }] }) with the extension's own
    image check (one download: metadata + model, as on a page). For evaluations:
    <code>node test/run-all.mjs extra --page "test/image-scores.html?data=...&name=..." --save DIR</code>.</p>
  <pre id="log"></pre>
  <script src="../metadata.js"></script>
  <script type="module">
    const log = s => { document.getElementById('log').textContent += s + '\n'; };
    const q = new URLSearchParams(location.search);
    let listener;
    const root = new URL('..', location.href).href;
    window.chrome = { runtime: { getURL: p => root + p, onMessage: { addListener: f => { listener = f; } }, sendMessage: async () => {} } };
    self.__aibModelsUrl ??= new URL('../models/', location.href).href; // models.js loads them from this test server
    await import('../models.js');
    const check = url => new Promise(res => listener({ target: 'offscreen', type: 'imageUrl', url }, null, res));
    const { rows } = await (await fetch(q.get('data'))).json();
    const out = [];
    for (const [i, r] of rows.entries()) {
      // A few at a time: downloads overlap, the model runs two at a time anyway.
      out[i] = check(r.url).then(res => ({ score: res?.score ?? null, source: res?.source || 'model' })).catch(() => ({ score: null }));
      if (i % 4 === 3) await out[i];
      document.title = `${i + 1}/${rows.length}`;
    }
    const scores = await Promise.all(out);
    const failed = scores.filter(s => s.score == null).length;
    log(`scored ${rows.length - failed}, failed ${failed}`);
    window.__saveAs = { name: q.get('name') || 'image_scores', data: scores };
    window.__results = [{ name: `scored ${rows.length - failed} of ${rows.length} images`, ok: rows.length - failed > 0 }];
    window.__done = true;
  </script>
</body>
</html>
