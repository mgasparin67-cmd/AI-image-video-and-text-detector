<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube thumbnail evaluation</title>
  <style>body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; } pre { background: #f4f4f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; }</style>
</head>
<body>
  <h1>YouTube thumbnail evaluation</h1>
  <p>Scores the thumbnails in <code>youtube-thumbs.json</code> with the image model, exactly as the
    extension does (one download, metadata + model). Results go to <code>window.__rows</code>.
    Each video is in the dev or held-out half by its ID (<code>half()</code>), fixed before scoring.</p>
  <pre id="log">Loading…</pre>
  <script src="../metadata.js"></script>
  <script type="module">
    const log = (...a) => { document.getElementById('log').textContent += '\n' + a.join(' '); };
    let listener;
    const root = new URL('..', location.href).href;
    window.chrome = { runtime: { getURL: p => root + p, onMessage: { addListener: f => { listener = f; } }, sendMessage: async () => {} } };
    self.__aibModelsUrl ??= new URL('../models/', location.href).href; // models.js loads them from this test server
    await import('../models.js?v=' + Date.now()); // always the current version
    const job = msg => new Promise(res => listener({ target: 'offscreen', ...msg }, null, res));
    // Dev / held-out split by video ID, so it doesn't depend on the order of the file.
    window.half = id => ([...id].reduce((n, c) => n + c.charCodeAt(0), 0) % 2 ? 'heldout' : 'dev');
    const { rows } = await (await fetch('youtube-thumbs.json')).json();
    window.__rows = [];
    for (const r of rows) {
      const t0 = performance.now();
      const res = await job({ type: 'imageUrl', url: r.thumb });
      window.__rows.push({ ...r, half: half(r.id), score: res?.score ?? null, ms: Math.round(performance.now() - t0) });
      document.title = `${window.__rows.length}/${rows.length}`;
    }
    const T = 0.7;
    for (const set of ['pre-ai', 'likely-ai']) {
      const s = window.__rows.filter(r => r.set === set && r.score != null);
      log(`${set}: n=${s.length}, flagged at 70%: ${s.filter(r => r.score >= T).length}`);
    }
    window.__done = true;
    log('DONE');
  </script>
</body>
</html>
