<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home - Videos</title>
  <!-- An unbranded video home feed for the before/after store screenshots, using YouTube's element
       names so hiding.js finds the videos (?host=www.youtube.com). Made-up titles and channels. -->
  <style>
    :root { --ink: #0f0f0f; --muted: #606060; --line: #e5e5e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.4 Roboto, Arial, Helvetica, sans-serif; }
    .top { display: flex; align-items: center; gap: 16px; padding: 10px 18px; }
    .logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
    .logo i { width: 26px; height: 18px; border-radius: 5px; background: #222; display: grid; place-items: center; }
    .logo i::after { content: ""; border-left: 7px solid #fff; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; margin-left: 2px; }
    .box { flex: 1; max-width: 360px; height: 34px; border: 1px solid #ccc; border-radius: 999px; padding: 0 14px; display: flex; align-items: center; color: #888; }
    .chips { display: flex; gap: 10px; padding: 6px 18px 12px; }
    .chips span { padding: 5px 12px; border-radius: 8px; background: #f2f2f2; font-size: 13px; font-weight: 500; }
    .chips span:first-child { background: #0f0f0f; color: #fff; }
    #feed { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 14px; padding: 0 18px 40px; }
    ytd-rich-item-renderer { display: block; }
    .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; display: grid; place-items: center; padding: 10px; color: #fff; text-align: center;
      font: 800 21px/1.05 "Arial Black", Arial, sans-serif; letter-spacing: -.02em; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .thumb b { position: absolute; right: 7px; bottom: 7px; background: rgba(0,0,0,.8); font: 500 11.5px Arial, sans-serif; text-shadow: none; padding: 1px 5px; border-radius: 4px; }
    .meta { display: flex; gap: 10px; padding-top: 10px; }
    .ch { width: 32px; height: 32px; border-radius: 50%; flex: none; }
    h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
    .meta p { margin: 0; color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="top"><div class="logo"><i></i>Videos</div><div class="box">Search</div></div>
  <div class="chips"><span>All</span><span>Cooking</span><span>Travel</span><span>Music</span><span>Science</span></div>
  <div id="feed"></div>
  <script>
    // [title, channel, thumbnail text, colours, length, views]
    const VIDEOS = [
      ['I let ChatGPT plan my whole week', 'Daily Dose', 'CHATGPT RAN MY LIFE', ['#3a7bd5', '#00d2ff'], '18:24', '1.2M views · 2 days ago'],
      ['Sourdough for complete beginners', 'Crumb & Crust', 'YOUR FIRST LOAF', ['#c27b3e', '#e8b46a'], '22:10', '310K views · 1 month ago'],
      ['This AI makes any song in seconds', 'Future Beats', 'AI MUSIC?!', ['#8e2de2', '#ff6a88'], '11:02', '845K views · 5 days ago'],
      ['Hiking the Lofoten Islands in winter', 'Northbound', 'LOFOTEN ❄', ['#1e3c72', '#7aa7d9'], '27:45', '96K views · 3 weeks ago'],
      ['10 AI tools that will replace your job', 'Hustle Lab', '10 AI TOOLS', ['#f12711', '#f5af19'], '14:37', '2.4M views · 1 week ago'],
      ['How to fix a squeaky door hinge', 'Weekend Fixes', 'NO MORE SQUEAK', ['#4b6b3a', '#9bc27a'], '6:12', '58K views · 4 months ago'],
      ['Making a short film with Sora 2', 'Frame by Frame', 'SORA 2 FILM', ['#232526', '#6b6f75'], '9:58', '512K views · 6 days ago'],
      ['Street food tour of Hanoi', 'Eat the World', 'HANOI EATS', ['#d4145a', '#fbb03b'], '31:20', '1.8M views · 2 months ago']
    ];
    const feed = document.getElementById('feed');
    for (const [title, channel, label, [a, b], length, views] of VIDEOS) {
      const item = document.createElement('ytd-rich-item-renderer');
      item.innerHTML = `<div class="thumb" style="background:linear-gradient(135deg,${a},${b})">${label}<b>${length}</b></div>
        <div class="meta"><div class="ch" style="background:linear-gradient(135deg,${b},${a})"></div>
        <div><h3></h3><p>${channel}</p><p>${views}</p></div></div>`;
      item.querySelector('h3').textContent = title;
      feed.append(item);
    }
  </script>
  <script src="harness.js"></script>
</body>
</html>
