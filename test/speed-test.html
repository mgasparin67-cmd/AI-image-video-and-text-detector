<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image model speed test</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; }
    pre { background: #f4f4f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Image model speed test</h1>
  <p>URL options: <code>device</code> (wasm | webgpu), <code>threads</code>, <code>dtype</code> (q8 | q4 | fp16 | fp32),
    <code>engine</code> (lib | asyncify | jsep), <code>models</code> (path to the models folder),
    <code>img</code> (repeatable image URLs).</p>
  <pre id="log"></pre>
  <script type="module">
    import { env, pipeline } from '../lib/transformers.min.js';
    const q = new URLSearchParams(location.search);
    const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; };
    const device = q.get('device') || 'wasm';
    const threads = Number(q.get('threads') || 1);
    const dtype = q.get('dtype') || 'q8';
    const engine = q.get('engine') || 'lib';
    const base = engine === 'lib' ? new URL('../lib/', location.href).href : new URL('/ort/', location.href).href;
    const suffix = engine === 'lib' ? '' : '.' + engine;

    env.allowLocalModels = true; // same settings as models.js
    env.localModelPath = new URL(q.get('models') || '../models/', location.href).href;
    env.useWasmCache = false;
    env.backends.onnx.wasm.wasmPaths = { mjs: `${base}ort-wasm-simd-threaded${suffix}.mjs`, wasm: `${base}ort-wasm-simd-threaded${suffix}.wasm` };
    env.backends.onnx.wasm.numThreads = threads;

    log(`device=${device} threads=${threads} dtype=${dtype} engine=${engine} crossOriginIsolated=${self.crossOriginIsolated} webgpu=${!!navigator.gpu}`);
    try {
      let t0 = performance.now();
      const clf = await pipeline('image-classification', 'haywoodsloan/ai-image-detector-deploy', { dtype, device });
      log(`load: ${Math.round(performance.now() - t0)} ms`);

      const imgs = q.getAll('img').map(u => new URL(u, location.href).href);
      await clf(imgs[0]); // warm-up
      const times = [], scores = [];
      for (let pass = 0; pass < 2; pass++) {
        for (const u of imgs) {
          t0 = performance.now();
          const out = await clf(u, { top_k: 2 });
          times.push(performance.now() - t0);
          if (pass === 0) scores.push(`${u.split('/').pop()}: ${Math.round((out.find(o => o.label === 'artificial')?.score ?? 0) * 100)}%`);
        }
      }
      times.sort((a, b) => a - b);
      log(scores.join('\n'));
      log(`RESULT median ${Math.round(times[times.length >> 1])} ms per image (min ${Math.round(times[0])}, max ${Math.round(times.at(-1))}, n=${times.length})`);
    } catch (e) {
      log('ERROR', e?.message || e);
    }
    log('DONE');
  </script>
</body>
</html>
